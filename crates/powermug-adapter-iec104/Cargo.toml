[package]
name = "powermug-adapter-iec104"
description = "IEC 60870-5-104 South adapter of Powermug: a controlling station on igs-iec104 feeding the core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
repository.workspace = true

[lints]
workspace = true

[dependencies]
igs-iec104 = { version = "0.1.0", default-features = false }
igs-iec104-codec = "0.1.0"
igs-iec104-link = "0.1.0"
powermug-contract = { path = "../powermug-contract" }
powermug-pivot = { path = "../powermug-pivot" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tonic = { version = "=0.14.5", default-features = false, features = ["transport"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
uuid = { version = "1.29", features = ["v7", "rng"] }

[dev-dependencies]
powermug-core = { path = "../powermug-core" }
powermug-store = { path = "../powermug-store" }
tempfile = "3"
