[package]
name = "powermug-mgmt"
description = "Management API of Powermug: HTTPS with mutual TLS (rustls) on axum, target API v1 subset"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
repository.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8"
ed25519-dalek = "2"
powermug-core = { path = "../powermug-core" }
powermug-revision = { path = "../powermug-revision" }
powermug-store = { path = "../powermug-store" }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }

[dev-dependencies]
powermug-pivot = { path = "../powermug-pivot" }
base64 = "0.22"
ed25519-dalek = "2"
rcgen = { version = "=0.14.7", default-features = false, features = ["ring", "pem"] }
tempfile = "3"
