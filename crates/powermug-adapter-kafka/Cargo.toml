[package]
name = "powermug-adapter-kafka"
description = "North Kafka producer of Powermug: a flux destination of the core, produced to a Kafka topic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "powermug-kafka-producer"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
powermug-contract = { path = "../powermug-contract" }
powermug-pivot = { path = "../powermug-pivot" }
prost = "0.14"
rdkafka = { version = "=0.40.0", default-features = false, features = ["libz", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
powermug-core = { path = "../powermug-core" }
powermug-store = { path = "../powermug-store" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "net", "sync", "time"] }
