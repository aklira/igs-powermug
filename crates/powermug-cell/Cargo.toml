[package]
name = "powermug-cell"
description = "Powermug cell: one process that opens the stores and partition lanes and serves the management API over mutual TLS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "powermug-cell"
path = "src/main.rs"

[dependencies]
axum = "0.8"
ed25519-dalek = "2"
powermug-core = { path = "../powermug-core" }
powermug-mgmt = { path = "../powermug-mgmt" }
powermug-store = { path = "../powermug-store" }
powermug-revision = { path = "../powermug-revision" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
rcgen = { version = "=0.14.7", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging"] }
tempfile = "3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
