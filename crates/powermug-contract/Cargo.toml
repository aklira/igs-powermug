[package]
name = "powermug-contract"
description = "Adapter contract of Powermug: handshake, bounds, credits and peer identity over powermug.adapter.v1"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
repository.workspace = true

[lints]
workspace = true

[dependencies]
powermug-pivot = { path = "../powermug-pivot" }
prost = "0.14"
thiserror = "2"
# Pinned to 0.14.5. Later releases need Rust 1.88, which the workspace MSRV
# (1.89) now allows; moving to them is a separate change.
tonic = { version = "=0.14.5", default-features = false, features = ["server", "transport", "codegen", "router"] }
tonic-prost = "=0.14.5"
tokio = { version = "1", features = ["net", "rt", "macros", "io-util", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
hyper-util = { version = "0.1.11", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
tonic-prost-build = "=0.14.5"
# tonic-prost-build 0.14.5 accepts any 0.14, and 0.14.6 onward need Rust 1.88.
tonic-build = "=0.14.5"
protox = "0.10"

[dev-dependencies]
tempfile = "3"
