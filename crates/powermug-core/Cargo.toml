[package]
name = "powermug-core"
description = "Powermug core: adapter supervision and the telemetry data plane (point table, process image, lane)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
powermug-contract = { path = "../powermug-contract" }
powermug-pivot = { path = "../powermug-pivot" }
powermug-store = { path = "../powermug-store" }
prost = "0.14"
thiserror = "2"
uuid = { version = "1.29", features = ["v7", "rng"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
