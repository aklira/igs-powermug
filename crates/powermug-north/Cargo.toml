[package]
name = "powermug-north"
description = "Common part of the North producers of Powermug: the flux subscription, the delivery loop, and the record mapping"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
repository.workspace = true

[lints]
workspace = true

[dependencies]
powermug-contract = { path = "../powermug-contract" }
powermug-pivot = { path = "../powermug-pivot" }
prost = "0.14"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
powermug-core = { path = "../powermug-core" }
powermug-store = { path = "../powermug-store" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "net", "sync", "time"] }
