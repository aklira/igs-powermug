[package]
name = "powermug"
description = "Powermug gateway: single binary with roles core, adapter, revision and diag"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "powermug"
path = "src/main.rs"

[dependencies]
powermug-command = { path = "../powermug-command" }
powermug-revision = { path = "../powermug-revision" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
nix = { version = "0.32", default-features = false, features = ["process", "signal", "ptrace"] }
powermug-sandbox = { path = "../powermug-sandbox" }
powermug-adapter-iec104 = { path = "../powermug-adapter-iec104" }
tokio = { version = "1", features = ["net", "rt", "time"] }

[dev-dependencies]
igs-iec104 = { version = "0.1.0", default-features = false }
igs-iec104-codec = "0.1.0"
powermug-cell = { path = "../powermug-cell" }
powermug-contract = { path = "../powermug-contract" }
powermug-core = { path = "../powermug-core" }
powermug-pivot = { path = "../powermug-pivot" }
powermug-store = { path = "../powermug-store" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
