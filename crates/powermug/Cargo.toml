[package]
name = "powermug"
description = "Powermug gateway: single binary with roles core, adapter, revision and diag"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "powermug"
path = "src/main.rs"

[dependencies]
powermug-revision = { path = "../powermug-revision" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem"] }
nix = { version = "0.32", default-features = false, features = ["process", "signal", "ptrace"] }
powermug-sandbox = { path = "../powermug-sandbox" }
