# cargo-deny configuration (NFR-MNT-003, NFR-MNT-004, ADR-02).
[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
# Only permissive licences are accepted in production (ADR-02, PM-ACC-* and INST-013).
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true  # path dependencies inside this workspace

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
