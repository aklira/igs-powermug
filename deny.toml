# cargo-deny configuration (NFR-MNT-003, NFR-MNT-004, ADR-02).
[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
# Only permissive licences are accepted in production (ADR-02, PM-ACC-* and INST-013).
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    # Permissive, OSI approved. Pulled by the TLS backend ring and by webpki (rustls,
    # management interface, P2). To confirm with the owner, like MIT-0 and Zlib below.
    "ISC",
    # Permissive, OSI approved. Pulled by jsonschema (MIT-0 via borrow-or-share, Zlib via
    # foldhash). Accepted for the P1 validator; to confirm with the owner (SPECIFICATIONS.md
    # §6.7 lists the production set for protocol libraries).
    "MIT-0",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true  # path dependencies inside this workspace

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
