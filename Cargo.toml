[workspace]
resolver = "2"
members = [
    "crates/powermug-revision",
    "crates/powermug",
    "crates/powermug-sandbox",
    "crates/powermug-core",
    "crates/powermug-pivot",
    "crates/powermug-contract",
    "crates/powermug-store",
    "crates/powermug-adapter-iec104",
    "crates/powermug-adapter-kafka",
    "crates/powermug-north",
    "crates/powermug-adapter-mqtt",
    "crates/powermug-bench",
    "crates/powermug-mgmt",
    "crates/powermug-cell",
    "crates/powermug-command",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/aklira/igs-powermug"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
